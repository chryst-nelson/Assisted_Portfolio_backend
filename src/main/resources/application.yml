spring:
  application:
    name: portfolio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway; Hibernate only validates against it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    model:
      chat: google-genai
    google:
      genai:
        # Gemini Developer API (free tier) — API key only, no GCP project needed.
        # Do NOT set project-id or location here: setting either one silently
        # switches Spring AI into paid Vertex AI mode, and this API key will
        # then be rejected with a confusing 400 rather than a clear error.
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: ${GEMINI_TEMPERATURE:0.3}

server:
  port: ${SERVER_PORT:8080}

app:
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.cornelius.portfolio: INFO
