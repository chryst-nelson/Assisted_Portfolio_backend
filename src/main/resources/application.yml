spring:
  application:
    name: portfolio
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway; Hibernate only validates against it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}

app:
  ollama:
    # Leave OLLAMA_BASE_URL empty to run on the rule-based engine alone.
    base-url: ${OLLAMA_BASE_URL:}
    model: ${OLLAMA_MODEL:qwen2.5:1.5b}
    keep-alive: ${OLLAMA_KEEP_ALIVE:24h}
    max-tokens: ${OLLAMA_MAX_TOKENS:350}
    context-tokens: ${OLLAMA_CONTEXT_TOKENS:3072}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:90}
    max-concurrent: ${OLLAMA_MAX_CONCURRENT:1}
  chat:
    # How often the assistant re-reads the portfolio from the database (admin "Reindex" forces it).
    knowledge-ttl-seconds: ${KNOWLEDGE_TTL_SECONDS:120}
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.cornelius.portfolio: INFO
