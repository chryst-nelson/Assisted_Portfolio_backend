# Ollama server (or add to the backend server with:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ollama.yml up -d).
# NEVER expose port 11434 to the internet: Ollama has no authentication.
# Separate server: set OLLAMA_BIND to this server's PRIVATE IP in .env and allow
# port 11434 in the security group only from the backend server's security group.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: portfolio-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: downloads the model into the volume, then exits.
  ollama-init:
    image: ollama/ollama:latest
    container_name: portfolio-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]

volumes:
  ollama_data:
